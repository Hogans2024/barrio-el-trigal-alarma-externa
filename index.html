<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página B — Alarma Externa Barrio El Trigal</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0c101d;
        color: #fff;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        width: 100%;
        max-width: 640px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #ffd700;
        margin-bottom: 24px;
      }
      #estado-conexion {
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 20px;
        padding: 6px 14px;
        border-radius: 999px;
        display: inline-block;
      }
      .conexion-ok { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
      .conexion-bad { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.4); }
      #estado-alarma {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 900;
        line-height: 1.1;
        padding: 32px 16px;
        border-radius: 24px;
        border: 2px solid;
        margin-bottom: 32px;
      }
      .alarma-espera { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.5); color: #4ade80; }
      .alarma-activa { background: rgba(248,113,113,0.15); border-color: #ef4444; color: #f87171; animation: pulso 1s infinite; }
      @keyframes pulso {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      .btn {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        padding: 18px;
        font-size: 1.1rem;
        font-weight: 800;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }
      .btn:hover:not(:disabled) { opacity: 0.9; }
      .btn:active:not(:disabled) { transform: scale(0.98); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-primario { background: #ffd700; color: #111; }
      .btn-secundario { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>🚨 ALARMA EXTERNA — BARRIO EL TRIGAL</h1>
      <div id="estado-conexion" class="conexion-bad">Conexión: —</div>
      <div id="estado-alarma" class="alarma-espera">En espera</div>
      <button id="btn-habilitar" class="btn btn-primario">🔊 Habilitar Alarma Externa</button>
      <button id="btn-silenciar" class="btn btn-secundario" disabled>Silenciar sonido local</button>
      <p style="margin-top:16px;font-size:0.75rem;color:#64748b">
        Mantén esta pestaña abierta. El botón de habilitación desbloquea el
        audio del navegador (requisito de autoplay) y activa la escucha.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
